<!doctype html>
<html lang="es" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fcfbf9" />
    <script>
      // Antes de pintar: tema elegido por el usuario o, si no eligió, el del dispositivo (evita el destello blanco).
      try {
        var t = localStorage.getItem('lm-theme')
        document.documentElement.dataset.theme = t || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
      } catch (e) {}
    </script>
    <meta name="description" content="LM Perfumes: fragancias para damas y caballeros. Pide por WhatsApp y paga en dólares o bolívares." />
    <link rel="icon" href="/images/lm-logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..800;1,400..700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>LM Perfumes | Fragancias para damas y caballeros</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
